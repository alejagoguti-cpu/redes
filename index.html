<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes · Ecosistema Interactivo de Red Física Kennedy</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- KaTeX Math LaTeX CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Base Theme, Sidebar & Physics Canvas Network Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/kennedy-network.css">
</head>
<body>

  <div class="app-layout">

    <!-- ================= BARRA LATERAL (SIDEBAR) ================= -->
    <aside class="sidebar" id="appSidebar">
      
      <!-- Brand / Logo Icon -->
      <a class="brand-icon" href="index.html" title="Redes · Inicio" aria-label="Inicio">
        <i class="fa-solid fa-diagram-project"></i>
      </a>

      <!-- Primary Icon Navigation -->
      <nav class="icon-nav" aria-label="Navegación Módulos de Red">
        <a href="index.html" class="icon-nav-item active" data-tooltip="Red Física Interactiva">
          <i class="fa-solid fa-house"></i>
        </a>
        <a href="modules/network-01/index.html" class="icon-nav-item" data-tooltip="Módulo 01 · Escala Metropolitana">
          <i class="fa-solid fa-city"></i>
        </a>
        <a href="modules/network-02/index.html" class="icon-nav-item" data-tooltip="Módulo 02 · Medición de Red">
          <i class="fa-solid fa-chart-simple"></i>
        </a>
        <a href="modules/network-03/index.html" class="icon-nav-item" data-tooltip="Módulo 03 · Discurso vs Realidad">
          <i class="fa-solid fa-eye"></i>
        </a>
        <a href="modules/network-04/index.html" class="icon-nav-item" data-tooltip="Módulo 04 · Macromodelos">
          <i class="fa-solid fa-bullseye"></i>
        </a>
        <a href="modules/network-05/index.html" class="icon-nav-item" data-tooltip="Módulo 05 · Navegador Multiescalar">
          <i class="fa-solid fa-magnifying-glass-location"></i>
        </a>
        <a href="modules/network-06/index.html" class="icon-nav-item" data-tooltip="Módulo 06 · Indicadores & ODS">
          <i class="fa-solid fa-earth-americas"></i>
        </a>
        <a href="modules/network-07/index.html" class="icon-nav-item" data-tooltip="Módulo 07 · Simulador Interactivo">
          <i class="fa-solid fa-flask"></i>
        </a>
        <a href="modules/network-08/index.html" class="icon-nav-item" data-tooltip="Módulo 08 · Simulación 3D">
          <i class="fa-solid fa-cube"></i>
        </a>
      </nav>

      <!-- Footer Action Icon -->
      <div class="icon-nav-footer">
        <a href="#settings" class="icon-nav-item" data-tooltip="Configuración">
          <i class="fa-solid fa-gear"></i>
        </a>
      </div>

    </aside>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <i class="fa-solid fa-circle-nodes"></i> Motor de Red Física 60fps & Simulación · Localidad de Kennedy
        </div>
      </header>

      <!-- Interactive Canvas Physics Stage -->
      <div class="network-wrapper">

        <!-- Top Controls Bar -->
        <div class="graph-toolbar">
          <button type="button" class="graph-btn active" data-filter="ALL">
            <i class="fa-solid fa-network-wired"></i> Toda la Red
          </button>
          <button type="button" class="graph-btn" data-filter="1" style="--btn-color:#e89a6c;">
            <i class="fa-solid fa-store"></i> Eje 1: Comercial
          </button>
          <button type="button" class="graph-btn" data-filter="2" style="--btn-color:#5b8def;">
            <i class="fa-solid fa-bus"></i> Eje 2: Movilidad
          </button>
          <button type="button" class="graph-btn" data-filter="3" style="--btn-color:#2fd4c8;">
            <i class="fa-solid fa-water"></i> Eje 3: Ambiental
          </button>
          <button type="button" class="graph-btn" id="resetPhysicsBtn" title="Reiniciar Física de Nodos">
            <i class="fa-solid fa-rotate-right"></i> Reiniciar Grafo
          </button>
        </div>

        <!-- 60fps Physics Canvas -->
        <canvas id="networkPhysicsCanvas"></canvas>

        <!-- Floating Hint -->
        <div class="graph-hint">
          <i class="fa-solid fa-hand-pointer"></i> Arrastra cualquier nodo para moverlo en tiempo real o haz clic para ver su fórmula matemática explícita.
        </div>

        <!-- Sliding Math Calculation Drawer -->
        <aside class="calc-drawer" id="calcDrawer">
          <div class="drawer-header">
            <div class="drawer-title">
              <h3>Fórmula de Cálculo</h3>
              <span class="drawer-tag">Ecuación Algebraica</span>
            </div>
            <button type="button" class="drawer-close-btn" id="drawerCloseBtn" aria-label="Cerrar panel">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- Formula Box -->
          <div class="drawer-formula-box">
            <div class="drawer-formula-display"></div>
            <div class="drawer-formula-desc"></div>
          </div>

          <!-- Variables list -->
          <div class="drawer-sec-title">
            <i class="fa-solid fa-database"></i> Variables Cuantitativas & Fuentes
          </div>
          <div class="drawer-vars-list"></div>

          <!-- Mechanism -->
          <div class="drawer-sec-title">
            <i class="fa-solid fa-diagram-project"></i> Mecanismo Causal
          </div>
          <div class="drawer-formula-desc drawer-mecanismo" style="margin-bottom:14px;"></div>

          <!-- Citations Footer -->
          <div class="drawer-meta-box">
            <strong>Sustentación Académica:</strong><br>
            <span class="cite drawer-fuente"></span>
          </div>
        </aside>

      </div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="js/sidebar.js"></script>
  <script src="js/kennedy-network.js"></script>
</body>
</html>
