<style>
  :root{

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Poppins',sans-serif; overflow:hidden; }
  .app{ display:flex; min-height:100vh; }
  .main{ flex:1; position:relative; min-width:0; background:var(--bg); height:100vh; overflow:hidden; }

  .intro{
    position:absolute; top:18px; left:50%; transform:translateX(-50%); z-index:6; text-align:center;
    pointer-events:none; max-width:720px; padding:6px 20px;
  }
  .intro h1{ font-size:15px; font-weight:400; margin:0 0 3px; line-height:1.4; color:var(--ink); }
  .intro p{ margin:0; font-size:11.5px; font-weight:300; color:var(--ink-dim); }

  .legend{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%); z-index:6;
    font-size:11px; font-weight:300; color:var(--ink-dim); text-align:center; white-space:nowrap;
  }
  .legend b{ color:var(--accent); font-weight:500; }

  .stage{ position:absolute; inset:0; }
  .edges-svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
  .cap{
    position:absolute; transform:translate(0,0); z-index:2; font-size:12px; font-weight:500;
    letter-spacing:.04em; pointer-events:none; white-space:nowrap;
  }

  .node{
    position:absolute; border-radius:50%; transform:translate(-50%,-50%); z-index:3;
    display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer;
    transition:opacity .25s ease, width .3s ease, height .3s ease; touch-action:none; user-select:none;
  }
  .node .lbl{ color:var(--ink); font-weight:300; line-height:1.3; pointer-events:none;
    display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; }
  .node .lbl small{ display:block; font-size:.8em; color:var(--ink-dim); margin-bottom:2px; font-weight:400; }
  .node.dim{ opacity:.22; }
  .node.sel{ filter:brightness(.96); }

  .badge{
    position:absolute; transform:translate(-50%,-50%); z-index:4; width:18px; height:18px; border-radius:50%;
    background:#fff; border:1px solid var(--line); color:var(--accent); font-size:12px; font-weight:500; line-height:16px;
    text-align:center; cursor:pointer; transition:opacity .25s ease;
  }
  .badge:hover{ background:var(--line); color:#fff; }
  .badge.dim{ opacity:.15; }

  .panel{
    position:absolute; top:0; right:0; bottom:0; z-index:20; width:min(400px,92vw);
    background:rgba(255,255,255,0.97); border-left:1px solid #e8e2d9; box-shadow:-12px 0 40px rgba(0,0,0,.08);

  .panel.open{ transform:translateX(0); }
  .panel-close{
    position:absolute; top:18px; right:18px; width:30px; height:30px; border-radius:50%; border:1px solid #e3ddd3;
    background:#faf8f5; color:var(--ink-dim); cursor:pointer; font-size:13px;
  }
  .panel-close:hover{ background:var(--line); color:#fff; }
  .panel-kind{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin:0 0 8px; font-weight:500; }
  .panel h2{ font-size:16px; font-weight:400; margin:0 30px 4px 0; line-height:1.45; }
  .panel .block{ margin-top:16px; padding-top:16px; border-top:1px solid #efeae2; }
  .panel .block b{ display:block; font-size:10.5px; color:var(--ink-dim); font-weight:500; margin-bottom:8px; text-transform:uppercase; letter-spacing:.06em; }
  .panel .block p{ margin:0; font-size:12.5px; font-weight:300; line-height:1.55; }
  .panel .rel-chip{ display:block; padding:9px 13px; margin-bottom:7px; border-radius:12px; background:#faf6f0; border:1px solid #eadfce; font-size:12px; font-weight:300; cursor:pointer; }
  .panel .rel-chip:hover{ background:#f3e9da; }
  .panel a{ font-size:12px; color:var(--accent); word-break:break-all; }

  .nav-btn{
    position:absolute; z-index:10; padding:9px 18px; border-radius:999px; border:1px solid #e3d6c3; background:rgba(255,255,255,.9);

  }
  .nav-btn:hover{ background:var(--line); color:#fff; border-color:var(--line); }
  .nav-btn.show{ display:block; }
  #backBtn{ bottom:36px; left:50%; transform:translateX(-50%); }
  #allBtn{ top:16px; right:20px; background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(176,138,91,.35); padding:10px 20px; font-weight:500; }

  #netEditorPanel{
    position:absolute; top:14px; left:14px; z-index:10; background:rgba(255,255,255,.85);
    border:1px solid #e8e2d9; border-radius:14px; padding:8px 14px; display:flex; align-items:center; gap:12px;
    font-size:11.5px; font-weight:300; color:var(--ink-dim);
  }
  #netEditorPanel input{ width:90px; accent-color:var(--accent); }
  #netEditorPanel button{ padding:5px 11px; border-radius:8px; border:1px solid #e3d6c3; background:#faf6f0; color:var(--accent); font-size:11px; cursor:pointer; font-family:inherit; }
  #netCoordsOutput{ display:none; position:absolute; top:46px; left:0; width:340px; height:120px; font-family:monospace; font-size:9.5px; background:#fff; border:1px solid #e3d6c3; color:#555; border-radius:8px; padding:6px; z-index:105; }
</style>

      ["P1-C5", "P1-C1", "+", "Los usos comerciales e industriales alrededor atraen más volumen de alimentos hacia la central."],
      ["P1-C6", "P1-C4", "+", "La concentración de actividad económica en María Paz y El Amparo refuerza la concentración de bodegas y locales."],
      ["P1-C2", "P1-C6", "+", "El flujo de vehículos de carga dinamiza la actividad económica de María Paz y El Amparo."],
    ],
    n2: [
      ["P2-C6", "P2-C5", "+", "Una alta densidad residencial en el suroccidente concentra los viajes en moto."],
      ["P2-C5", "P2-C2", "+", "La concentración de viajes en moto añade presión a las vías y alarga los desplazamientos."],
      ["P2-C3", "P2-C2", "+", "Los viajes por trabajo se concentran en horas pico y alargan el tiempo de desplazamiento."],
      ["P2-C6", "P2-C4", "+", "Una alta densidad residencial favorece la demanda de modos sostenibles (relación por verificar)."],
    ],
    n3: [
      ["P3-C2", "P3-C6", "+", "Las conexiones erradas pendientes de intervención siguen aportando materia orgánica."],
      ["P3-C3", "P3-C4", "+", "Parte de los vertimientos industriales se canaliza por puntos de descarga clandestina."],
      ["P3-C5", "P3-C4", "+", "Los residuos sólidos acumulados obstruyen y favorecen descargas clandestinas en rondas."],
      ["P3-C1", "P3-C4", "+", "Las conexiones erradas generan puntos de descarga no autorizados hacia humedales y rondas."],
    ],
    n4: [
      ["P4-C1", "P4-C4", "+", "Más venta informal en general ocupa más andenes."],
      ["P4-C2", "P4-C3", "+", "La presión de venta informal en María Paz se extiende hacia El Amparo."],
      ["P4-C1", "P4-C5", "+", "La venta informal atrae el cargue y descargue de mercancías en la vía."],
    ],
  };
  Object.keys(CAUSE_REL_EXTRA).forEach(k => CAUSE_REL[k].push(...CAUSE_REL_EXTRA[k]));
  const QUAD = { n1: [0, 0], n2: [1, 0], n3: [0, 1], n4: [1, 1] };

  const toId = cid => cid.toLowerCase().replace("-", "_");
  const nodes = [], byId = {}, rels = [];
  Object.keys(CAUSES).forEach(mId => {
    CAUSES[mId].forEach(c => { const n = { ...c, nid: toId(c.id), macroId: mId }; nodes.push(n); byId[n.nid] = n; });
    CAUSE_REL[mId].forEach(([a, b, pol, verbo]) => rels.push({ from: toId(a), to: toId(b), pol, verbo: a + " → " + b + ": " + verbo }));
  });

  // Hoja "Relaciones entre P"
  const MACRO_REL_DATA = [
    ["n1", "n2", "+", "La concentración comercial-logística incrementa demanda de movimientos de abastecimiento y acceso. Estado: sustentable con datos de Corabastos + movilidad."],
    ["n1", "n4", "+", "La concentración de actividad económica coincide con usos intensivos del espacio público en el entorno. Estado: requiere medición local para cuantificar intensidad."],
    ["n2", "n4", "+", "La sobrecarga vial puede aumentar conflictos por estacionamiento y cargue/descargue en vía. Estado: requiere aforo local."],
    ["n1", "n3", "+", "La actividad económica solo se conecta con contaminación hídrica mediante un mecanismo demostrado (residuos/vertimientos/conexiones). Estado: no asumir causalidad directa."],
  ];
  const macroNodes = MACRO.map((m, i) => ({ nid: m.id, macroId: m.id, isMacro: true, id: "P" + (i + 1), causa: m.corto.split(" · ")[1] }));
  macroNodes.forEach(n => byId[n.nid] = n);
  const macroRels = MACRO_REL_DATA.map(([a, b, pol, verbo]) => ({ from: a, to: b, pol, verbo: byId[a].id + " → " + byId[b].id + ": " + verbo }));

  let view = { mode: "macro", macroId: null };
  let curNodes = macroNodes, curRels = macroRels;

  const mainEl = document.getElementById("main");
  const stage = document.getElementById("stage");
  const svg = document.getElementById("edgesSvg");
  const panel = document.getElementById("panel"), body = document.getElementById("panelBody");
  const SVGNS = "http://www.w3.org/2000/svg";
  const mainW = () => Math.max(320, mainEl.clientWidth), mainH = () => Math.max(320, mainEl.clientHeight);

  // Posiciones guardadas (pegar aquí lo que entrega "Copiar coordenadas")
  const SAVED_POSITIONS = {};

  let pos = {}, caps = {}, scale = 1;
  let nodeEls = {}, edgeEls = [], capEls = [];

  // Distribución orgánica tipo red: tamaño según nº de conexiones, atracción por flechas y repulsión entre burbujas.
  // Es determinista (misma semilla = mismo dibujo en cada carga).
  function forceLayout(list, allRels, area, rMax, seed) {
    let s = seed * 9301 + 49297;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const ids = list.map(n => n.nid), set = new Set(ids);
    const es = allRels.filter(r => set.has(r.from) && set.has(r.to));
    const deg = {}; ids.forEach(i => deg[i] = 0);
    es.forEach(e => { deg[e.from]++; deg[e.to]++; });
    const dMax = Math.max(1, ...Object.values(deg)), dMin = Math.min(...Object.values(deg));
    const R = {}; ids.forEach(i => R[i] = rMax * (0.55 + 0.45 * ((deg[i] - dMin) / Math.max(1, dMax - dMin))));
    const cx = (area.x0 + area.x1) / 2, cy = (area.y0 + area.y1) / 2;
    const P = {};
    ids.forEach((i, k) => {
      const a = (k / ids.length) * Math.PI * 2 + rnd() * 0.8;
      P[i] = { x: cx + Math.cos(a) * (area.x1 - area.x0) * 0.3 * (0.6 + rnd() * 0.4), y: cy + Math.sin(a) * (area.y1 - area.y0) * 0.3 * (0.6 + rnd() * 0.4) };
    });
    const clamp = i => {
      const m = R[i] * 1.3;
      P[i].x = Math.max(area.x0 + m, Math.min(area.x1 - m, P[i].x));
      P[i].y = Math.max(area.y0 + m, Math.min(area.y1 - m, P[i].y));
    };
    for (let it = 0; it < 500; it++) {
      const k = 1 - it / 500;
      const F = {}; ids.forEach(i => F[i] = { x: 0, y: 0 });
      for (let a = 0; a < ids.length; a++) for (let b = a + 1; b < ids.length; b++) {
        const A = P[ids[a]], B = P[ids[b]];
        let dx = A.x - B.x, dy = A.y - B.y, d = Math.hypot(dx, dy) || 0.01;
        const min = (R[ids[a]] + R[ids[b]]) * 1.45;
        const push = d < min ? (min - d) * 0.5 : (min * 3.2 > d ? (min * 3.2 - d) * 0.025 : 0);
        F[ids[a]].x += dx / d * push; F[ids[a]].y += dy / d * push;
        F[ids[b]].x -= dx / d * push; F[ids[b]].y -= dy / d * push;
      }
      es.forEach(e => {
        const A = P[e.from], B = P[e.to];
        const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 0.01;
        const target = (R[e.from] + R[e.to]) * 2.5;
        const pull = (d - target) * 0.04 * k;
        F[e.from].x += dx / d * pull; F[e.from].y += dy / d * pull;
        F[e.to].x -= dx / d * pull; F[e.to].y -= dy / d * pull;
      });
      // que ninguna línea pase por detrás de una burbuja que no es de sus extremos
      es.forEach(e => {
        const A = P[e.from], B = P[e.to], vx = B.x - A.x, vy = B.y - A.y, L2 = vx * vx + vy * vy || 1;
        ids.forEach(i => {
          if (i === e.from || i === e.to) return;
          const t = Math.max(0, Math.min(1, ((P[i].x - A.x) * vx + (P[i].y - A.y) * vy) / L2));
          const qx = A.x + vx * t, qy = A.y + vy * t;
          let dx = P[i].x - qx, dy = P[i].y - qy; const d = Math.hypot(dx, dy) || 0.01, need = R[i] * 1.5;
          if (d < need) { const f = (need - d) * 0.35; F[i].x += dx / d * f; F[i].y += dy / d * f; F[e.from].x -= dx / d * f * 0.25; F[e.from].y -= dy / d * f * 0.25; F[e.to].x -= dx / d * f * 0.25; F[e.to].y -= dy / d * f * 0.25; }
        });
      });
      ids.forEach(i => {
        P[i].x += F[i].x + (cx - P[i].x) * 0.004; P[i].y += F[i].y + (cy - P[i].y) * 0.004; clamp(i);
      });
    }
    // penalización: cruces entre líneas + líneas que tocan burbujas ajenas
    let score = 0;
    const seg = e => [P[e.from], P[e.to]];
    for (let a = 0; a < es.length; a++) for (let b = a + 1; b < es.length; b++) {
      if (es[a].from === es[b].from || es[a].from === es[b].to || es[a].to === es[b].from || es[a].to === es[b].to) continue;
      const [p1, p2] = seg(es[a]), [p3, p4] = seg(es[b]);
      const d1x = p2.x - p1.x, d1y = p2.y - p1.y, d2x = p4.x - p3.x, d2y = p4.y - p3.y, den = d1x * d2y - d1y * d2x;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((p3.x - p1.x) * d2y - (p3.y - p1.y) * d2x) / den, u = ((p3.x - p1.x) * d1y - (p3.y - p1.y) * d1x) / den;
      if (t > 0 && t < 1 && u > 0 && u < 1) score += 10;
    }
    es.forEach(e => {
      const A = P[e.from], B = P[e.to], vx = B.x - A.x, vy = B.y - A.y, L2 = vx * vx + vy * vy || 1;
      ids.forEach(i => {
        if (i === e.from || i === e.to) return;
        const t = Math.max(0, Math.min(1, ((P[i].x - A.x) * vx + (P[i].y - A.y) * vy) / L2));
        if (Math.hypot(P[i].x - (A.x + vx * t), P[i].y - (A.y + vy * t)) < R[i] * 1.2) score += 30;
      });
    });
    const out = {}; ids.forEach(i => out[i] = { x: P[i].x, y: P[i].y, r: R[i] });
    return { out, score };
  }
  // Prueba varias semillas y se queda con el dibujo de menos cruces
  function bestLayout(list, allRels, area, rMax, seed) {
    let best = null;
    for (let k = 0; k < 14; k++) {
      const res = forceLayout(list, allRels, area, rMax, seed * 31 + k * 7 + 1);
      if (!best || res.score < best.score) best = res;
      if (best.score === 0) break;
    }
    return best.out;
  }

  function defaultLayout() {
    const W = mainW(), H = mainH(), top = 100, bottom = 50;
    pos = {}; caps = {};
    if (view.mode === "macro") {
      const m = Math.min(W, H);
      const P = { n1: [0.38, 0.40, 0.17], n2: [0.76, 0.28, 0.13], n4: [0.76, 0.72, 0.15], n3: [0.24, 0.82, 0.11] };
      Object.keys(P).forEach(k => { pos[k] = { x: W * P[k][0], y: H * P[k][1], r: m * P[k][2] }; });
      return;
    }
    if (view.mode === "detail") {
      const area = { x0: 50, y0: 110, x1: W - 50, y1: H - 80 };
      Object.assign(pos, bestLayout(nodes.filter(n => n.macroId === view.macroId), rels, area, Math.min(W, H) * 0.14, 7));
      return;
    }
    const QUAD = { n1: [0, 0], n2: [1, 0], n3: [0, 1], n4: [1, 1] };
    const qw = W / 2, qh = (H - top - bottom) / 2;
    MACRO.forEach((m, i) => {
      const [qx, qy] = QUAD[m.id];
      const area = { x0: qx * qw + 16, y0: top + qy * qh + 24, x1: (qx + 1) * qw - 16, y1: top + (qy + 1) * qh - 6 };
      Object.assign(pos, bestLayout(nodes.filter(n => n.macroId === m.id), rels, area, Math.min(qw / 6.2, qh / 4.4), 11 + i));
      caps[m.id] = { x: area.x0, y: top + qy * qh - 2 };
    });
    Object.keys(SAVED_POSITIONS).forEach(k => { if (pos[k]) pos[k] = { ...pos[k], ...SAVED_POSITIONS[k] }; });
  }

  function rgba(hex, a) {
    const h = hex.replace("#", "");
    return `rgba(${parseInt(h.substr(0, 2), 16)},${parseInt(h.substr(2, 2), 16)},${parseInt(h.substr(4, 2), 16)},${a})`;
  }
  const rad = id => pos[id].r * scale;

  function styleNode(n) {
    const el = nodeEls[n.nid], r = rad(n.nid), col = macroById[n.macroId].color;
    el.style.width = el.style.height = r * 2 + "px";
    el.style.left = pos[n.nid].x + "px"; el.style.top = pos[n.nid].y + "px";
    el.style.background = col;
    el.style.boxShadow = `0 0 0 ${r * 0.12}px ${rgba(col, 0.55)}, 0 0 0 ${r * 0.26}px ${rgba(col, 0.28)}`;
    const lbl = el.firstChild, fs = n.isMacro ? Math.max(11, Math.min(16, r * 0.11)) : Math.max(9, Math.min(13, r * 0.17));
    lbl.style.fontSize = fs + "px";
    lbl.style.width = r * 1.6 + "px";
    lbl.style.webkitLineClamp = Math.max(2, Math.floor((r * 1.5) / (fs * 1.3)));
  }

  function edgeGeom(r) {
    const a = pos[r.from], b = pos[r.to];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    const ra = rad(r.from) * 1.2, rb = rad(r.to) * 1.2;
    return { x1: a.x + ux * ra, y1: a.y + uy * ra, x2: b.x - ux * rb, y2: b.y - uy * rb };
  }
  function updateEdges() {
    edgeEls.forEach(({ r, line, hit }) => {
      const g = edgeGeom(r);
      [line, hit].forEach(l => { l.setAttribute("x1", g.x1); l.setAttribute("y1", g.y1); l.setAttribute("x2", g.x2); l.setAttribute("y2", g.y2); });
    });
  }

  function build() {
    nodeEls = {}; edgeEls = []; capEls = [];
    stage.querySelectorAll(".node,.badge,.cap").forEach(e => e.remove());
    svg.querySelectorAll("line").forEach(e => e.remove());
    // las lineas nuevas se agregan al final del svg
    if (view.mode === "macro") { curNodes = macroNodes; curRels = macroRels; }
    else if (view.mode === "detail") { curNodes = nodes.filter(n => n.macroId === view.macroId); curRels = rels.filter(r => byId[r.from].macroId === view.macroId); }
    else { curNodes = nodes; curRels = rels; }
    defaultLayout();
    (view.mode === "all" ? MACRO : []).forEach(m => {
      const c = document.createElement("div"); c.className = "cap"; c.textContent = m.corto;
      c.style.left = caps[m.id].x + "px"; c.style.top = caps[m.id].y + "px"; c.style.color = m.ink;
      stage.appendChild(c); capEls.push(c);
    });
    curRels.forEach(r => {
      const line = document.createElementNS(SVGNS, "line");
      line.setAttribute("stroke", "#d8b48a"); line.setAttribute("stroke-width", "1.3"); line.setAttribute("stroke-linecap", "round");
      svg.appendChild(line);
      const hit = document.createElementNS(SVGNS, "line");
      hit.setAttribute("stroke", "transparent"); hit.setAttribute("stroke-width", "14"); hit.style.pointerEvents = "stroke"; hit.style.cursor = "pointer";
      hit.addEventListener("mouseenter", () => { line.setAttribute("stroke-width", "3"); });
      hit.addEventListener("mouseleave", () => { line.setAttribute("stroke-width", "1.3"); });
      hit.addEventListener("click", e => { e.stopPropagation(); openRel(r); });
      svg.appendChild(hit);
      edgeEls.push({ r, line, hit });
    });
    curNodes.forEach(n => {
      const el = document.createElement("div"); el.className = "node";
      const lbl = document.createElement("div"); lbl.className = "lbl";
      lbl.innerHTML = `<small>${n.id}</small>${esc(n.causa)}`;
      el.appendChild(lbl);
      stage.appendChild(el); nodeEls[n.nid] = el;
      styleNode(n);
      el.addEventListener("mouseenter", () => highlight(n.nid));
      el.addEventListener("mouseleave", () => highlight(null));
      enableDrag(el, n);
    });
    updateEdges();
  }

  function highlight(id) {
    const keep = new Set();
    if (id) { keep.add(id); curRels.forEach(r => { if (r.from === id) keep.add(r.to); if (r.to === id) keep.add(r.from); }); }
    curNodes.forEach(n => nodeEls[n.nid].classList.toggle("dim", !!id && keep.size > 1 && !keep.has(n.nid)));
    edgeEls.forEach(({ r, line }) => {
      const dim = !!id && keep.size > 1 && !(r.from === id || r.to === id);
      line.style.opacity = dim ? 0.12 : 1;
    });
  }

  function enableDrag(el, n) {
    let start = null, moved = false;
    el.addEventListener("pointerdown", e => { start = { x: e.clientX, y: e.clientY }; moved = false; el.setPointerCapture(e.pointerId); el.style.transition = "none"; });
    el.addEventListener("pointermove", e => {
      if (!start) return;
      if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > 4) moved = true;
      if (!moved) return;
      const rect = mainEl.getBoundingClientRect();
      pos[n.nid].x = Math.max(20, Math.min(rect.width - 20, e.clientX - rect.left));
      pos[n.nid].y = Math.max(20, Math.min(rect.height - 20, e.clientY - rect.top));
      el.style.left = pos[n.nid].x + "px"; el.style.top = pos[n.nid].y + "px";
      updateEdges();
    });
    el.addEventListener("pointerup", () => { el.style.transition = ""; if (start && !moved) onNodeClick(n); start = null; });
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  function openRel(r) {
    const a = byId[r.from], b = byId[r.to];
    body.innerHTML = `
      <p class="panel-kind">Relación causal</p>
      <h2>${esc(a.id)} · ${esc(a.causa)} → ${esc(b.id)} · ${esc(b.causa)}</h2>
      <div class="block"><b>Polaridad</b><p>${r.pol === "-" ? "Negativa (–): si la causa aumenta, el efecto disminuye" : "Positiva (+): si la causa aumenta, el efecto también aumenta"}</p></div>
      <div class="block"><b>Mecanismo causal</b><p>${esc(r.verbo)}</p></div>`;
    panel.classList.add("open");
  }

  function openPanel(id) {
    const n = byId[id];
    const chips = (title, items) => items.length ? `<div class="block"><b>${title}</b>${items.map(([k, pol]) => `<div class="rel-chip" data-goto="${k}">${esc(byId[k].id)} · ${esc(byId[k].causa)} <b style="display:inline;margin:0;">(${pol})</b></div>`).join("")}</div>` : "";
    const valor = n.valor !== undefined
      ? `<span style="font-size:20px;font-weight:400;">${n.valor.toLocaleString("es-CO")}</span> ${esc(n.unidad)}`
      : `${esc(n.nota)} <span style="color:var(--ink-dim);">(${esc(n.unidad)})</span>`;
    body.innerHTML = `
      <p class="panel-kind" style="color:${macroById[n.macroId].ink};">Causa ${esc(n.id)} · ${esc(macroById[n.macroId].corto)}</p>
      <h2>${esc(n.causa)}</h2>
      <div class="block"><b>Indicador tangible</b><p>${esc(n.indicador)}</p></div>
      <div class="block"><b>Valor / evidencia disponible</b><p>${valor}</p></div>
      <div class="block"><b>Año · Ámbito</b><p>${esc(n.anio)} · ${esc(n.ambito)}</p></div>
      <div class="block"><b>Estado del dato</b><p>${esc(n.estado)}</p></div>
      ${chips("Es causada por", rels.filter(r => r.to === id).map(r => [r.from, r.pol]))}
      ${chips("Provoca o intensifica", rels.filter(r => r.from === id).map(r => [r.to, r.pol]))}
      <div class="block"><b>Fuente</b><a href="${esc(n.fuente)}" target="_blank" rel="noopener">${esc(n.fuente)}</a></div>`;
    body.querySelectorAll("[data-goto]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); openPanel(el.dataset.goto); }));
    curNodes.forEach(x => nodeEls[x.nid].classList.toggle("sel", x.nid === id));
    panel.classList.add("open");
  }
  document.getElementById("panelClose").addEventListener("click", () => { panel.classList.remove("open"); curNodes.forEach(x => nodeEls[x.nid].classList.remove("sel")); });

  document.getElementById("nodeScaleRange").addEventListener("input", e => {
    scale = parseFloat(e.target.value); curNodes.forEach(styleNode); updateEdges();
  });
  document.getElementById("copyNetCoordsBtn").addEventListener("click", async () => {
    let out = "const SAVED_POSITIONS = {\n";
    curNodes.forEach(n => { const p = pos[n.nid]; out += `  "${n.nid}": { x: ${p.x.toFixed(1)}, y: ${p.y.toFixed(1)}, r: ${(p.r * scale).toFixed(1)} },\n`; });
    out += "};";
    const box = document.getElementById("netCoordsOutput"); box.value = out; box.style.display = "block"; box.select();
    try { await navigator.clipboard.writeText(out); } catch (err) {}
  });

  const INTRO_SUB = {
    macro: "Toca un problema para ver sus causas, o una línea para ver el mecanismo",
    detail: "Causas del problema — toca una burbuja para ver su indicador, o una línea para ver el mecanismo",
    all: "Todas las causas de P1–P4 — toca una burbuja para ver su indicador, o una línea para ver el mecanismo",
  };
  const backBtn = document.getElementById("backBtn"), allBtn = document.getElementById("allBtn");
  function setView(mode, macroId) {
    view = { mode, macroId: macroId || null };
    panel.classList.remove("open");
    document.getElementById("netCoordsOutput").style.display = "none";
    document.getElementById("introTitle").textContent = mode === "detail" ? macroById[macroId].corto : "Colapso operativo y logístico del modelo de ocupación de Kennedy frente a la capacidad de soporte del territorio";
    document.getElementById("introSub").textContent = INTRO_SUB[mode];
    backBtn.classList.toggle("show", mode !== "macro");
    allBtn.classList.toggle("show", mode !== "all");
    build();
  }
  function onNodeClick(n) { if (n.isMacro) setView("detail", n.nid); else openPanel(n.nid); }
  backBtn.addEventListener("click", () => setView("macro"));
  allBtn.addEventListener("click", () => setView("all"));

  window.addEventListener("resize", build);
